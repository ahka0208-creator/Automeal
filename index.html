<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分枱紙自動生成器 - 營地/餐廳 2欄 A4 列印工具</title>
  <!-- Tailwind CSS (界面 UI 樣式) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#035485',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 全局字體優先選用港台繁體與微軟正黑體 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Traditional Chinese", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
    }

    /* 螢幕預覽 A4 紙張視覺效果 */
    .a4-preview-page {
      width: 210mm;
      height: 297mm;
      padding: 8mm;
      background: white;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      margin: 0 auto 24px auto;
      box-sizing: border-box;
      position: relative;
    }

    /* 卡片格網排版 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      height: 100%;
      width: 100%;
      box-sizing: border-box;
      gap: 0px;
    }

    /* 每頁格數動態設定 */
    .grid-2x2 { grid-template-rows: repeat(2, 1fr); }
    .grid-2x3 { grid-template-rows: repeat(3, 1fr); }
    .grid-2x4 { grid-template-rows: repeat(4, 1fr); }
    .grid-2x5 { grid-template-rows: repeat(5, 1fr); }

    /* 卡片單元格 */
    .table-card {
      box-sizing: border-box;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      position: relative;
      background-color: #ffffff;
      overflow: hidden;
    }

    /* 一版四格時增加內距，版面更疏落大方 */
    .grid-2x2 .table-card {
      padding: 20px 22px;
    }

    /* 邊框樣式 */
/* ... existing code ... -->
        <!-- 每頁格數選擇 -->
        <div class="flex items-center gap-2">
          <label class="text-slate-400 text-xs font-medium">每頁格數:</label>
          <select id="layout-grid-select" onchange="updateLayoutConfig()" class="bg-slate-900 text-white text-xs border border-slate-700 rounded px-2.5 py-1 focus:outline-none focus:border-brand-500">
            <option value="grid-2x2" selected>2 × 2 (每頁 4 格 - 預設)</option>
            <option value="grid-2x3">2 × 3 (每頁 6 格)</option>
            <option value="grid-2x4">2 × 4 (每頁 8 格)</option>
            <option value="grid-2x5">2 × 5 (每頁 10 格)</option>
          </select>
        </div>

        <!-- 框線樣式 -->
        <div class="flex items-center gap-2">
          <label class="text-slate-400 text-xs font-medium">格線樣式:</label>
          <select id="layout-border-select" onchange="updateLayoutConfig()" class="bg-slate-900 text-white text-xs border border-slate-700 rounded px-2.5 py-1 focus:outline-none focus:border-brand-500">
            <option value="border-dashed-style" selected>虛線剪裁線</option>
            <option value="border-solid-style">實線邊框</option>
            <option value="border-none-style">無框線</option>
          </select>
        </div>

        <!-- 字型大小滑桿 -->
        <div class="flex items-center gap-2">
          <label class="text-slate-400 text-xs font-medium">卡片文字大小:</label>
          <input type="range" id="font-size-slider" min="12" max="28" value="19" step="0.5" oninput="updateFontSize(this.value)" class="w-24 accent-brand-500 cursor-pointer">
          <span id="font-size-val" class="text-xs font-mono text-brand-300 w-9">19px</span>
        </div>
      </div>

      <!-- 即時統計徽章 -->
      <div class="flex items-center gap-2 text-xs bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
        <span class="text-slate-300">團體: <strong id="stat-groups" class="text-brand-100 font-semibold">0</strong></span>
        <span class="text-slate-500">|</span>
        <span class="text-slate-300">全圍: <strong id="stat-full" class="text-emerald-400 font-semibold">0</strong></span>
        <span class="text-slate-500">|</span>
        <span class="text-slate-300">半圍: <strong id="stat-half" class="text-amber-400 font-semibold">0</strong></span>
        <span class="text-slate-500">|</span>
        <span class="text-slate-300">總卡數: <strong id="stat-total-cards" class="text-white font-bold">0</strong></span>
        <span class="bg-brand-600 text-white px-2 py-0.5 rounded-full font-semibold ml-1" id="stat-pages">預計 0 頁 A4</span>
      </div>

      <!-- 版面列印快捷操作 -->
      <div class="flex items-center gap-3">
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold shadow flex items-center gap-1.5 transition active:scale-95">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          列印 / 存為 PDF
        </button>
      </div>
    </div>
  </header>

  <!-- 次級控制排版列 (列印時隱藏) -->
  <div class="no-print bg-slate-800 text-slate-200 border-b border-slate-700 px-4 py-2.5 text-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-6">
        <!-- 每頁格數選擇 -->
        <div class="flex items-center gap-2">
          <label class="text-slate-400 text-xs font-medium">每頁格數:</label>
          <select id="layout-grid-select" onchange="updateLayoutConfig()" class="bg-slate-900 text-white text-xs border border-slate-700 rounded px-2.5 py-1 focus:outline-none focus:border-brand-500">
            <option value="grid-2x3">2 × 3 (每頁 6 格)</option>
            <option value="grid-2x4" selected>2 × 4 (每頁 8 格 - 預設)</option>
            <option value="grid-2x5">2 × 5 (每頁 10 格)</option>
          </select>
        </div>

        <!-- 框線樣式 -->
        <div class="flex items-center gap-2">
          <label class="text-slate-400 text-xs font-medium">格線樣式:</label>
          <select id="layout-border-select" onchange="updateLayoutConfig()" class="bg-slate-900 text-white text-xs border border-slate-700 rounded px-2.5 py-1 focus:outline-none focus:border-brand-500">
            <option value="border-dashed-style" selected>虛線剪裁線</option>
            <option value="border-solid-style">實線邊框</option>
            <option value="border-none-style">無框線</option>
          </select>
        </div>

        <!-- 字型大小滑桿 -->
        <div class="flex items-center gap-2">
          <label class="text-slate-400 text-xs font-medium">卡片文字大小:</label>
          <input type="range" id="font-size-slider" min="12" max="20" value="15" step="0.5" oninput="updateFontSize(this.value)" class="w-24 accent-brand-500 cursor-pointer">
          <span id="font-size-val" class="text-xs font-mono text-brand-300 w-8">15px</span>
        </div>
      </div>

      <!-- 快捷資料維護 -->
      <div class="flex items-center gap-2">
        <button onclick="loadDemoData()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1 rounded transition">
          🔄 載入預設示範
        </button>
        <button onclick="clearAllData()" class="text-xs bg-rose-900/60 hover:bg-rose-800 text-rose-200 px-2.5 py-1 rounded transition">
          🗑️ 清空全部
        </button>
      </div>
    </div>
  </div>

  <!-- 主內容區域：左側操作面板 + 右側 A4 列印預覽 -->
  <div class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col lg:flex-row gap-6">
    
    <!-- 左側操作面板 (列印時隱藏) -->
    <div class="no-print w-full lg:w-[460px] shrink-0 flex flex-col gap-4">
      
      <!-- 頁籤選單 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-1 flex text-sm font-medium">
        <button id="tab-btn-form" onclick="switchTab('form')" class="flex-1 py-2 text-center rounded-lg transition bg-brand-600 text-white shadow-sm">
          📝 表單輸入
        </button>
        <button id="tab-btn-batch" onclick="switchTab('batch')" class="flex-1 py-2 text-center rounded-lg transition text-slate-600 hover:bg-slate-100">
          ⚡ 批量文字匯入
        </button>
      </div>

      <!-- 頁籤內容 1：表單輸入模式 -->
      <div id="tab-content-form" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col gap-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 id="form-title" class="font-bold text-slate-800 flex items-center gap-1.5">
            <span>➕ 新增團體分枱設定</span>
          </h2>
          <button id="btn-cancel-edit" onclick="cancelEdit()" class="hidden text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-1 rounded">
            取消編輯
          </button>
        </div>

        <form id="group-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
          <!-- 團體名稱 -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">團體名稱 <span class="text-rose-500">*</span></label>
            <input type="text" id="input-name" required placeholder="例如：示昕學校(小學)、基督教復興教會" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:outline-none">
          </div>

          <!-- 特別標記 / 備註 -->
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">特別標記 / 備註 <span class="text-slate-400 font-normal">(選填，顯示於名稱下方)</span></label>
            <input type="text" id="input-tag" placeholder="例如：(西) 或 Vegetables" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-brand-500 focus:outline-none">
          </div>

          <!-- 總枱數與張數自動拆拆解 -->
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-3">
            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="text-xs font-bold text-slate-700">總枱數</label>
                <span class="text-xs text-slate-500">輸入含 .5 會自動計半圍</span>
              </div>
              <input type="number" id="input-total-tables" step="0.5" min="0.5" value="3" oninput="autoCalculateCards()" class="w-full text-sm font-bold border border-slate-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-brand-500 focus:outline-none">
            </div>

            <!-- 自動算出的全圍與半圍張數 (可手動調整) -->
            <div class="grid grid-cols-2 gap-3 pt-1 border-t border-slate-200">
              <div>
                <label class="block text-[11px] font-medium text-slate-600 mb-1">全圍卡張數 (8人/枱)</label>
                <input type="number" id="input-full-count" min="0" value="3" class="w-full text-sm border border-slate-300 rounded-lg px-2.5 py-1 focus:ring-2 focus:ring-brand-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-[11px] font-medium text-slate-600 mb-1">半圍卡張數 (4人/枱)</label>
                <input type="number" id="input-half-count" min="0" value="0" class="w-full text-sm border border-slate-300 rounded-lg px-2.5 py-1 focus:ring-2 focus:ring-brand-500 focus:outline-none">
              </div>
            </div>
          </div>

          <!-- 動態日期與餐次設定 -->
          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="text-xs font-bold text-slate-700">📅 日期及餐次明細</label>
              <button type="button" onclick="addDayRow()" class="text-xs bg-brand-50 text-brand-700 hover:bg-brand-100 font-semibold px-2.5 py-1 rounded-md border border-brand-200 flex items-center gap-1 transition">
                <span>➕</span> 加下一日
              </button>
            </div>
            
            <div id="day-rows-container" class="space-y-2.5 max-h-[260px] overflow-y-auto pr-1">
              <!-- 動態渲染日期列 -->
            </div>
          </div>

          <!-- 提交按鈕 -->
          <div class="pt-2">
            <button type="submit" id="btn-submit-form" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 rounded-lg shadow transition active:scale-[0.99] flex justify-center items-center gap-1.5">
              <span>➕ 加入分枱紙清單</span>
            </button>
          </div>
        </form>
      </div>

      <!-- 頁籤內容 2：批量文字匯入模式 -->
      <div id="tab-content-batch" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex-col gap-3">
        <h2 class="font-bold text-slate-800 text-sm">⚡ 批量貼上文字匯入</h2>
        <p class="text-xs text-slate-500 leading-relaxed">
          請依下方格式貼上多筆資料（每行一組），系統會自動拆解團體名稱、總枱數與跨日餐次：
        </p>

        <!-- 格式說明範例 -->
        <div class="bg-slate-800 text-slate-200 p-2.5 rounded-lg text-[11px] font-mono leading-relaxed overflow-x-auto">
          團體名稱 | 總枱數 | 日期餐次明細 | 特別標記(選填)<br>
          <span class="text-emerald-400">示昕學校(小學) | 3 | 25/11 BBQ; 26/11 早午晚; 27/11 早午</span><br>
          <span class="text-amber-300">基督教復興教會 | 6.5 | 28/11 晚; 29/11 早午</span><br>
          <span class="text-sky-300">Dragonfly_2 | 0.5 | 2/12 午晚(素); 3/12 早(素), BBQ(素) | (西) Vegetables</span>
        </div>

        <textarea id="batch-input-text" rows="8" placeholder="在此貼上你的文字紀錄..." class="w-full text-xs font-mono border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-brand-500 focus:outline-none leading-normal"></textarea>

        <button type="button" onclick="handleBatchImport()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg shadow transition active:scale-[0.99]">
          ⚡ 一鍵解析並批量匯入
        </button>
      </div>

      <!-- 已加入團體清單列表 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col gap-3 flex-1">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
            📋 已設定團體 (<span id="group-count-badge">0</span>)
          </h3>
          <span class="text-[11px] text-slate-400">可上下排序或點擊編輯</span>
        </div>

        <div id="group-list-container" class="space-y-2 max-h-[320px] overflow-y-auto pr-1">
          <!-- 動態載入團體卡片 -->
        </div>
      </div>

    </div>

    <!-- 右側 A4 即時列印預覽區域 -->
    <div class="flex-1 flex flex-col items-center">
      <div class="no-print w-full flex justify-between items-center mb-3 px-1">
        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1">
          <span>📄</span> A4 列印預覽 (即時繪製)
        </span>
        <span class="text-xs text-slate-400">實際列印時將自動隱藏左右操作欄</span>
      </div>

      <!-- 預覽容器 (印表機輸出區) -->
      <div id="print-preview-container" class="print-area w-full flex flex-col items-center">
        <!-- 動態渲染一頁頁 A4 -->
      </div>
    </div>

  </div>

  <!-- 自訂通知訊息 Toast (取代原生 alert，列印時隱藏) -->
  <div id="toast-container" class="no-print fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- 自訂確認對話框 Modal (取代原生 confirm，列印時隱藏) -->
  <div id="confirm-modal" class="no-print hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-5 border border-slate-200">
      <h3 class="font-bold text-slate-800 text-base mb-2">確認操作</h3>
      <p id="confirm-modal-message" class="text-sm text-slate-600 mb-5 leading-relaxed"></p>
      <div class="flex justify-end gap-2">
        <button type="button" onclick="closeConfirmModal(false)" class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">
          取消
        </button>
        <button type="button" onclick="closeConfirmModal(true)" class="px-4 py-2 text-sm font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-lg shadow-sm transition">
          確定
        </button>
      </div>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------------
    // 1. 全局狀態與示範資料
    // -----------------------------------------------------------------
    let groups = [];
    let editingId = null;
    
    // 版面設定
    let layoutConfig = {
      gridClass: 'grid-2x2',
      borderClass: 'border-dashed-style',
      fontSize: 19,
      cardsPerPage: 4
    };
// ... existing code ... -->
    function updateLayoutConfig() {
      layoutConfig.gridClass = document.getElementById('layout-grid-select').value;
      layoutConfig.borderClass = document.getElementById('layout-border-select').value;

      if (layoutConfig.gridClass === 'grid-2x2') layoutConfig.cardsPerPage = 4;
      else if (layoutConfig.gridClass === 'grid-2x3') layoutConfig.cardsPerPage = 6;
      else if (layoutConfig.gridClass === 'grid-2x4') layoutConfig.cardsPerPage = 8;
      else if (layoutConfig.gridClass === 'grid-2x5') layoutConfig.cardsPerPage = 10;

      renderPreview();
    }
// ... existing code ... -->
</body>
</html>
