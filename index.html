<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分枱紙自動生成器 - 營地 / 餐廳 A4 列印工具</title>
  <!-- 載入楷體網頁字體作為手機／無內置標楷體裝置的後備字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              500: '#0284c7',
              600: '#0369a1',
              700: '#035485',
            }
          }
        }
      }
    };
  </script>
  <style>
    /* 全局字體：優先選用香港繁體及清晰無襯線字體 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      overflow-x: hidden;
    }

    /* 螢幕預覽縮放外框（防止手機或窄視窗出現橫向捲動） */
    .preview-scale-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .a4-page-slot {
      position: relative;
      margin-bottom: 24px;
    }

    /* A4 紙張實體尺寸（直向 210mm x 297mm） */
    .a4-page {
      width: 210mm;
      height: 297mm;
      padding: 8mm;
      background: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.14), 0 4px 10px -4px rgba(15, 23, 42, 0.08);
      box-sizing: border-box;
      transform-origin: top left;
      position: relative;
    }

    /* 卡片 2 欄網格排版 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      gap: 0;
    }

    /* 每頁格數設定 */
    .grid-2x2 { grid-template-rows: repeat(2, 1fr); }
    .grid-2x3 { grid-template-rows: repeat(3, 1fr); }
    .grid-2x4 { grid-template-rows: repeat(4, 1fr); }
    .grid-2x5 { grid-template-rows: repeat(5, 1fr); }

    /* 卡片字體風格切換（預設標楷體，還原原版列印樣式） */
    .font-kaiti .table-card {
      font-family: "DFKai-SB", "標楷體", "BiauKai", "BiauKaiTC", "Kaiti TC", "STKaiti", "LXGW WenKai TC", serif;
    }
    .font-sans-card .table-card {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    }

    /* 單張分枱紙卡片 */
    .table-card {
      box-sizing: border-box;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      background-color: #ffffff;
      overflow: hidden;
      word-break: break-word;
    }

    /* 一版四格（A6 比例）加大留白，貼合原版直身卡片視覺 */
    .grid-2x2 .table-card {
      padding: 26px 20px 24px 20px;
    }

    /* 框線樣式：使用邊框重疊處理，避免中間格線變粗 */
    .border-dashed-style {
      border-top: 1px dashed #64748b;
      border-left: 1px dashed #64748b;
    }
    .border-dashed-style .table-card {
      border-right: 1px dashed #64748b;
      border-bottom: 1px dashed #64748b;
    }

    .border-solid-style {
      border-top: 1px solid #1f2937;
      border-left: 1px solid #1f2937;
    }
    .border-solid-style .table-card {
      border-right: 1px solid #1f2937;
      border-bottom: 1px solid #1f2937;
    }

    .border-none-style .table-card {
      border: 1px solid transparent;
    }

    /* 卡片文字層級（還原圖片：頂部標題、中間日期獨立加粗換行配餐次、底部人數上限） */
    .card-header {
      width: 100%;
    }

    .card-title {
      font-size: calc(var(--card-font-size, 21px) * 1.32);
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: 0.06em;
      color: #111827;
    }

    .card-badges {
      font-size: calc(var(--card-font-size, 21px) * 1.02);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: 0.04em;
      color: #111827;
      margin-top: 4px;
    }

    .card-meals {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.55em;
      margin: 8px 0;
      color: #111827;
    }

    .grid-2x2 .card-meals {
      gap: 1.05em;
      margin: 14px 0;
    }

    .meal-day-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .meal-date {
      font-size: calc(var(--card-font-size, 21px) * 1.38);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.02em;
      color: #111827;
      margin-bottom: 0.14em;
    }

    .meal-desc {
      font-size: calc(var(--card-font-size, 21px) * 1.0);
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: 0.06em;
      color: #111827;
    }

    .card-footer {
      width: 100%;
      font-size: calc(var(--card-font-size, 21px) * 0.96);
      font-weight: 400;
      letter-spacing: 0.06em;
      color: #111827;
    }

    /* 頁碼角標（只喺螢幕預覽顯示） */
    .page-label {
      position: absolute;
      top: -24px;
      left: 0;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
    }

    /* 列印專用規則：鎖死 A4 尺寸、隱藏所有操作介面、避免斷頁 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }

      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .no-print {
        display: none !important;
      }

      .main-layout {
        display: block !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .preview-scale-wrapper {
        display: block !important;
        overflow: visible !important;
      }

      .a4-page-slot {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        page-break-after: always;
        break-after: page;
      }

      .a4-page-slot:last-child {
        page-break-after: auto;
        break-after: auto;
      }

      .a4-page {
        transform: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        padding: 8mm !important;
      }

      .page-label {
        display: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 次級版面設定控制列（列印時隱藏） -->
  <div class="no-print bg-slate-800 text-slate-200 border-b border-slate-700 px-4 py-2.5 text-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-4 sm:gap-6">
        <!-- 每頁格數 -->
        <div class="flex items-center gap-2">
          <label for="layout-grid-select" class="text-slate-400 text-xs font-medium">每頁格數:</label>
          <select id="layout-grid-select" onchange="updateLayoutConfig()" class="bg-slate-900 text-white text-xs border border-slate-700 rounded-md px-2.5 py-1.5 focus:outline-none focus:border-brand-500">
            <option value="grid-2x2" selected>2 × 2 (每頁 4 格 - 預設)</option>
            <option value="grid-2x3">2 × 3 (每頁 6 格)</option>

        <!-- 框線樣式 -->

          <select id="layout-border-select" onchange="updateLayoutConfig()" class="bg-slate-900 text-white text-xs border border-slate-700 rounded-md px-2.5 py-1.5 focus:outline-none focus:border-brand-500">
            <option value="border-solid-style" selected>幼實線邊框 (原版)</option>

        <div class="flex items-center gap-2">

          <select id="layout-font-select" onchange="updateLayoutConfig()" class="bg-slate-900 text-white text-xs border border-slate-700 rounded-md px-2.5 py-1.5 focus:outline-none focus:border-brand-500">
            <option value="font-kaiti" selected>標楷體 (原版)</option>

        <!-- 字體大小滑桿 -->

          <input type="range" id="font-size-slider" min="12" max="28" value="21" step="0.5" oninput="updateFontSize(this.value)" class="w-24 sm:w-28 accent-brand-500 cursor-pointer">
          <span id="font-size-val" class="text-xs font-mono text-brand-300 w-10">21px</span>

      <!-- 資料維護按鈕 -->
<!-- ... existing code ... */
  <script>
    // =========================================================================
    // 1. 狀態定義與預設示範資料（參考用戶原有分枱紙及實拍樣式）
    // =========================================================================
    const STORAGE_KEY = 'camp_table_cards_v3';

    let groups = [];
    let editingId = null;
    let confirmCallback = null;

    // 預設版面配置：一版四格 (2 × 2) + 幼實線 + 標楷體
    let layoutConfig = {
      gridClass: 'grid-2x2',
      borderClass: 'border-solid-style',
      fontClass: 'font-kaiti',
      fontSize: 21,
      cardsPerPage: 4
    };

    const DEMO_GROUPS = [
      {
        id: 'demo-0',
        name: '基督中心堂（荃灣）',
        tag: '',
        totalTables: 4,
        fullCount: 4,
        halfCount: 0,
        days: [
          { date: '24/12', b: false, l: false, d: true, bbq: false, veg: false, customTables: '' },
          { date: '25/12', b: true, l: true, d: false, bbq: false, veg: false, customTables: '' },
          { date: '26/12', b: true, l: true, d: false, bbq: false, veg: false, customTables: '' }
        ]
      },
      {
        id: 'demo-1',
        name: '基督教復興教會',
        tag: '',
        totalTables: 6.5,
        fullCount: 6,
        halfCount: 1,
        days: [
          { date: '28/11', b: false, l: false, d: true, bbq: false, veg: false, customTables: '' },
          { date: '29/11', b: true, l: true, d: false, bbq: false, veg: false, customTables: '' }
        ]
      },
      {
        id: 'demo-2',
        name: 'Dragonfly_2',
        tag: '（西）\nVegetables',
        totalTables: 0.5,
        fullCount: 0,
        halfCount: 1,
        days: [
          { date: '2/12', b: false, l: true, d: true, bbq: false, veg: true, customTables: '' },
          { date: '3/12', b: true, l: false, d: false, bbq: true, veg: true, customTables: '' }
        ]
      }
    ];

    // =========================================================================
    // 2. 輔助工具函數（HTML 跳脫、Toast 通知、Modal 確認、儲存）
    // =========================================================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colorMap = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        info: 'bg-slate-800 text-white'
      };
      toast.className = `${colorMap[type] || colorMap.info} px-4 py-2.5 rounded-lg shadow-lg text-xs sm:text-sm font-medium transition-all duration-300 opacity-0 translate-y-2`;
      toast.textContent = message;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', 'translate-y-2');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    function openConfirmModal(message, onConfirm) {
      confirmCallback = onConfirm;
      document.getElementById('confirm-modal-message').textContent = message;
      document.getElementById('confirm-modal').classList.remove('hidden');
    }

    function closeConfirmModal(confirmed) {
      document.getElementById('confirm-modal').classList.add('hidden');
      if (confirmed && typeof confirmCallback === 'function') {
        confirmCallback();
      }
      confirmCallback = null;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ groups, layoutConfig }));
      } catch (err) {
        // 沙盒預覽環境可能停用 localStorage，靜默忽略
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.groups)) {
            groups = parsed.groups;
          }
          if (parsed.layoutConfig) {
            layoutConfig = { ...layoutConfig, ...parsed.layoutConfig };
          }
          return true;
        }
      } catch (err) {
        // 靜默回退至示範資料
      }
      return false;
    }

    // =========================================================================
    // 3. 頁籤與版面控制
    // =========================================================================
    function switchTab(tab) {
      const formBtn = document.getElementById('tab-btn-form');
      const batchBtn = document.getElementById('tab-btn-batch');
      const formContent = document.getElementById('tab-content-form');
      const batchContent = document.getElementById('tab-content-batch');

      if (tab === 'form') {
        formBtn.className = 'flex-1 py-2 text-center rounded-lg transition bg-brand-600 text-white shadow-sm';
        batchBtn.className = 'flex-1 py-2 text-center rounded-lg transition text-slate-600 hover:bg-slate-100';
        formContent.classList.remove('hidden');
        formContent.classList.add('flex');
        batchContent.classList.add('hidden');
        batchContent.classList.remove('flex');
      } else {
        batchBtn.className = 'flex-1 py-2 text-center rounded-lg transition bg-brand-600 text-white shadow-sm';
        formBtn.className = 'flex-1 py-2 text-center rounded-lg transition text-slate-600 hover:bg-slate-100';
        batchContent.classList.remove('hidden');
        batchContent.classList.add('flex');
        formContent.classList.add('hidden');
        formContent.classList.remove('flex');
      }
    }

    function updateLayoutConfig() {
      layoutConfig.gridClass = document.getElementById('layout-grid-select').value;
      layoutConfig.borderClass = document.getElementById('layout-border-select').value;
      layoutConfig.fontClass = document.getElementById('layout-font-select').value;

      if (layoutConfig.gridClass === 'grid-2x2') layoutConfig.cardsPerPage = 4;
      else if (layoutConfig.gridClass === 'grid-2x3') layoutConfig.cardsPerPage = 6;
      else if (layoutConfig.gridClass === 'grid-2x4') layoutConfig.cardsPerPage = 8;
      else if (layoutConfig.gridClass === 'grid-2x5') layoutConfig.cardsPerPage = 10;

      saveState();
      renderPreview();
    }

    function updateFontSize(val) {
      layoutConfig.fontSize = parseFloat(val);
      document.getElementById('font-size-val').textContent = `${layoutConfig.fontSize}px`;
      document.documentElement.style.setProperty('--card-font-size', `${layoutConfig.fontSize}px`);
      saveState();
    }

    // 依據瀏覽器預覽欄寬度，自動等比例縮放 A4 頁面（不影響列印尺寸）
    function scalePreviewPages() {
      const wrapper = document.getElementById('preview-wrapper');
      if (!wrapper) return;
      const availableWidth = wrapper.clientWidth - 8;
      // 210mm 約等於 793.7px (96dpi)
      const a4WidthPx = 793.7;
      const a4HeightPx = 1122.5;
      const scale = Math.min(1, Math.max(0.32, availableWidth / a4WidthPx));

      document.querySelectorAll('.a4-page-slot').forEach(slot => {
        const page = slot.querySelector('.a4-page');
        if (!page) return;
        slot.style.width = `${a4WidthPx * scale}px`;
        slot.style.height = `${a4HeightPx * scale}px`;
        page.style.transform = `scale(${scale})`;
      });
    }

    // =========================================================================
    // 7. 餐次文字格式化與 A4 卡片渲染（日期獨立加粗置中 + 下一行餐次及枱數）
    // =========================================================================
    function formatMealLines(group) {
      const blocks = [];
      const defaultTables = group.totalTables;

      (group.days || []).forEach(day => {
        const tablesLabel = escapeHtml(day.customTables ? day.customTables : defaultTables);
        const vegSuffix = day.veg ? '（素）' : '';
        const regularMeals = [];
        if (day.b) regularMeals.push('早');
        if (day.l) regularMeals.push('午');
        if (day.d) regularMeals.push('晚');

        const dateHtml = day.date ? `<div class="meal-date">${escapeHtml(day.date)}</div>` : '';
        const descLines = [];

        if (regularMeals.length > 0) {
          descLines.push(`<div class="meal-desc">${regularMeals.join('、')}餐 ${tablesLabel} 枱${vegSuffix}</div>`);
        }
        if (day.bbq) {
          descLines.push(`<div class="meal-desc">BBQ ${tablesLabel} 枱${vegSuffix}</div>`);
        }

        if (dateHtml || descLines.length > 0) {
          blocks.push(`<div class="meal-day-block">${dateHtml}${descLines.join('')}</div>`);
        }
      });

      return blocks.join('');
    }

    function buildCardHtml(card) {
      const badges = [];
      if (card.isHalf) {
        badges.push('（半圍）');
      }
      if (card.tag) {
        const tagLines = card.tag.split(/\r?\n/).map(t => t.trim()).filter(Boolean);
        tagLines.forEach(t => badges.push(t));
      }

      // 結合半圍與括號標記，例如 （半圍）（西）
      let badgesHtml = '';
      if (badges.length > 0) {
        if (card.isHalf && card.tag && (card.tag.startsWith('(') || card.tag.startsWith('（'))) {
          const splitTag = card.tag.split(/\r?\n/);
          const firstLine = `（半圍）${escapeHtml(splitTag[0])}`;
          const restLines = splitTag.slice(1).map(l => `<div>${escapeHtml(l)}</div>`).join('');
          badgesHtml = `<div class="card-badges"><div>${firstLine}</div>${restLines}</div>`;
        } else {
          badgesHtml = `<div class="card-badges">${badges.map(b => `<div>${escapeHtml(b)}</div>`).join('')}</div>`;
        }
      }

      const limitText = card.isHalf ? '（限最多 4 人一枱）' : '（限最多 8 人一枱）';

      return `
        <div class="table-card">
          <div class="card-header">
            <div class="card-title">${escapeHtml(card.name)}</div>
            ${badgesHtml}
          </div>
          <div class="card-meals">
            ${card.mealsHtml}
          </div>
          <div class="card-footer">
            ${limitText}
          </div>
        </div>
      `;
    }

    function renderGroupList() {
      const container = document.getElementById('group-list-container');
      document.getElementById('group-count-badge').textContent = groups.length;

      if (groups.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-xs">
            暫時未有團體資料，請由上方新增或載入示範資料。
          </div>
        `;
        return;
      }

      container.innerHTML = groups.map((g, idx) => {
        const totalCards = g.fullCount + g.halfCount;
        const summaryDays = (g.days || []).map(d => d.date).filter(Boolean).join(', ');
        return `
          <div class="border border-slate-200 rounded-lg p-2.5 bg-slate-50/70 hover:bg-slate-50 transition flex items-start justify-between gap-2">
            <div class="min-w-0 flex-1">
              <div class="font-bold text-slate-800 text-sm truncate">${escapeHtml(g.name)}</div>
              <div class="flex flex-wrap items-center gap-1.5 mt-1 text-[11px]">
                <span class="bg-brand-100 text-brand-700 font-semibold px-1.5 py-0.5 rounded">${g.totalTables} 枱</span>
                ${g.fullCount > 0 ? `<span class="bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded">全圍×${g.fullCount}</span>` : ''}
                ${g.halfCount > 0 ? `<span class="bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded">半圍×${g.halfCount}</span>` : ''}
                <span class="text-slate-400">共 ${totalCards} 張</span>
              </div>
              ${summaryDays ? `<div class="text-[11px] text-slate-500 mt-1 truncate">📅 ${escapeHtml(summaryDays)}</div>` : ''}
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button type="button" onclick="moveGroup(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} title="上移" class="p-1 text-xs rounded border border-slate-200 bg-white hover:bg-slate-100 disabled:opacity-30">↑</button>
              <button type="button" onclick="moveGroup(${idx}, 1)" ${idx === groups.length - 1 ? 'disabled' : ''} title="下移" class="p-1 text-xs rounded border border-slate-200 bg-white hover:bg-slate-100 disabled:opacity-30">↓</button>
              <button type="button" onclick="editGroup('${g.id}')" title="編輯" class="px-2 py-1 text-xs font-medium text-brand-700 bg-brand-50 hover:bg-brand-100 rounded border border-brand-200">編輯</button>
              <button type="button" onclick="deleteGroup('${g.id}')" title="刪除" class="px-2 py-1 text-xs font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 rounded border border-rose-200">刪除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderPreview() {
      const container = document.getElementById('print-preview-container');
      const allCards = [];
      let totalFull = 0;
      let totalHalf = 0;

      groups.forEach(group => {
        const mealsHtml = formatMealLines(group);
        for (let i = 0; i < group.fullCount; i++) {
          allCards.push({ name: group.name, tag: group.tag, isHalf: false, mealsHtml });
          totalFull++;
        }
        for (let i = 0; i < group.halfCount; i++) {
          allCards.push({ name: group.name, tag: group.tag, isHalf: true, mealsHtml });
          totalHalf++;
        }
      });

      const perPage = layoutConfig.cardsPerPage;
      const totalPages = Math.ceil(allCards.length / perPage);

      // 更新頂部統計數字
      document.getElementById('stat-groups').textContent = groups.length;
      document.getElementById('stat-full').textContent = totalFull;
      document.getElementById('stat-half').textContent = totalHalf;
      document.getElementById('stat-total-cards').textContent = allCards.length;
      document.getElementById('stat-pages').textContent = `預計 ${totalPages} 頁 A4`;

      if (allCards.length === 0) {
        container.innerHTML = `
          <div class="w-full max-w-md bg-white rounded-xl border-2 border-dashed border-slate-300 p-10 text-center text-slate-400 my-6">
            <div class="text-3xl mb-2">📄</div>
            <p class="text-sm font-medium text-slate-600">目前未有分枱紙預覽</p>
            <p class="text-xs mt-1">請在左邊新增團體，或者撳右上角「載入示範資料」試玩。</p>
          </div>
        `;
        return;
      }

      let pagesHtml = '';
      for (let p = 0; p < totalPages; p++) {
        const pageCards = allCards.slice(p * perPage, (p + 1) * perPage);
        let gridInner = pageCards.map(c => buildCardHtml(c)).join('');

        // 補齊該頁空格，確保框線整齊對稱
        const emptySlots = perPage - pageCards.length;
        for (let e = 0; e < emptySlots; e++) {
          gridInner += `<div class="table-card"></div>`;
        }

        pagesHtml += `
          <div class="a4-page-slot mt-6">
            <div class="page-label">第 ${p + 1} 頁 / 共 ${totalPages} 頁（每頁 ${perPage} 格）</div>
            <div class="a4-page">
              <div class="cards-grid ${layoutConfig.gridClass} ${layoutConfig.borderClass} ${layoutConfig.fontClass}">
                ${gridInner}
              </div>
            </div>
          </div>
        `;
      }

      container.innerHTML = pagesHtml;
      scalePreviewPages();
    }

    function renderAll() {
      renderGroupList();
      renderPreview();
    }

    // =========================================================================
    // 8. 初始化啟動
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      const loaded = loadState();
      if (!loaded) {
        groups = JSON.parse(JSON.stringify(DEMO_GROUPS));
      }

      // 同步控制項 UI 與當前 layoutConfig
      document.getElementById('layout-grid-select').value = layoutConfig.gridClass;
      document.getElementById('layout-border-select').value = layoutConfig.borderClass;
      document.getElementById('layout-font-select').value = layoutConfig.fontClass || 'font-kaiti';
      document.getElementById('font-size-slider').value = layoutConfig.fontSize;
      document.getElementById('font-size-val').textContent = `${layoutConfig.fontSize}px`;
      document.documentElement.style.setProperty('--card-font-size', `${layoutConfig.fontSize}px`);

      resetForm();
      renderAll();
    });

    window.addEventListener('resize', scalePreviewPages);
  </script>
</body>
</html>
